<svg width="180" height="36" viewBox="0 0 180 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-dark-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
  </defs>
  <!-- Zsyio Luminous Indigo Icon Mark -->
  <g transform="translate(2, 2)">
    <rect width="32" height="32" rx="9" fill="url(#logo-dark-bg)"/>
    <rect x="0.5" y="0.5" width="31" height="31" rx="8.5" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
    <!-- Top Horizontal Bar -->
    <path d="M6.8 5C6.08 5 5.5 5.58 5.5 6.3V9.2C5.5 9.92 6.08 10.5 6.8 10.5H19.5L24.5 5H6.8Z" fill="#FFFFFF"/>
