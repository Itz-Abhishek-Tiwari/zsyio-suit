packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@google/genai': false
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  protobufjs: false
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - 'esbuild'
  - 'prisma'
  - 'sharp'
  - 'unrs-resolver'
